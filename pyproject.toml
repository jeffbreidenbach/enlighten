[project]
name = "enlighten"
version = "0.1.0"
description = "Browser-based light simulator for teaching holography"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
enlighten = "enlighten:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
